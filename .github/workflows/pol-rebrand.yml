name: AMiR VPN releases
on:
  push:
    branches: [codex/pol-arman-visual-fork]
permissions:
  contents: read
concurrency:
  group: amir-vpn-stable-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.release.outputs.build }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Select a new stable version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' app/pubspec.yaml)"
          test -n "$version"
          tag="v$version"
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          latest="$(printf '%s\n' "$tags" | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
          if [[ "$tag" == "$latest" ]] || [[ -n "$latest" && "$(printf '%s\n' "$tag" "$latest" | sort -V | tail -n 1)" != "$tag" ]]; then
            echo "Stable release $latest already covers $tag."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
  android:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e
      BUILD_TOOLS_VERSION: 36.0.0
      SIGNER_SHA256: a2ec7957ee651c464aaf978810e5613791ec1b342b23a714fbbc65a3e31bb95d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Test Go
        working-directory: core
        run: |
          go vet ./...
          go test ./...
          go test -tags with_gvisor ./internal/tunstack/
      - name: Test Flutter
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Install Android tooling and bind the core
        run: |
          ndk="$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/android/app/build.gradle.kts)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ndk" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk"
          go install "golang.org/x/mobile/cmd/gomobile@$GOMOBILE_VERSION" \
            "golang.org/x/mobile/cmd/gobind@$GOMOBILE_VERSION"
          mkdir -p app/android/app/libs
          v="$(awk '/^version:/ {split($2, version, "+"); print version[1]}' app/pubspec.yaml)"
          cd core
          gomobile bind -target=android -androidapi 24 -trimpath \
            -ldflags "-s -w -X github.com/armanlife/arman-vpn-client/core/internal/version.Current=$v" \
            -o ../app/android/app/libs/core.aar ./mobile
      - name: Build and verify the signed APK
        env:
          KEYSTORE: ${{ secrets.POL_ANDROID_DEBUG_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.POL_ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          key_file="$RUNNER_TEMP/pol-rebrand.p12"
          trap 'rm -f "$key_file" app/android/key.properties' EXIT
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          printf '%s' "$KEYSTORE" | base64 -d > "$key_file"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=debug\nkeyPassword=%s\n' \
            "$key_file" "$PASSWORD" "$PASSWORD" > app/android/key.properties
          v="$(awk '/^version:/ {split($2, version, "+"); print version[1]}' app/pubspec.yaml)"
          (cd app && flutter build apk --release --no-pub --dart-define="APP_VERSION=$v")
          mkdir -p out
          apk=out/pol-vpn-release.apk
          cp app/build/app/outputs/flutter-apk/app-release.apk "$apk"
          build_tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          signing="$("$build_tools/apksigner" verify --print-certs "$apk")"
          grep -Fx "Signer #1 certificate SHA-256 digest: $SIGNER_SHA256" <<< "$signing"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          grep -F "package: name='com.polvpn.app.debug'" <<< "$badging"
          grep -Fx "application-label:'AMiR VPN'" <<< "$badging"
          manifest="$("$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml)"
          grep -F 'android.net.VpnService' <<< "$manifest"
          (cd out && sha256sum pol-vpn-release.apk > pol-vpn-release.apk.sha256)
      - name: Package source and notices
        run: |
          git diff --name-only HEAD -- app core scripts
          # Flutter can regenerate Dart localization bindings and its Gradle
          # wrapper metadata. The archive contains the committed ARBs and
          # wrapper inputs that reproduce those generated files.
          git restore --source=HEAD -- ':(glob)app/lib/l10n/app_localizations*.dart' \
            app/android/gradle/wrapper/gradle-wrapper.properties
          bash scripts/package-android-source.sh out/pol-vpn-release.apk
      - name: Name release files
        working-directory: out
        run: |
          mv pol-vpn-release.apk amir-vpn-android.apk
          mv pol-vpn-release.apk.sha256 amir-vpn-android.apk.sha256
          sed -i 's/  pol-vpn-release\.apk$/  amir-vpn-android.apk/' amir-vpn-android.apk.sha256
          sha256sum --check amir-vpn-android.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: amir-vpn-android
          path: out/
          if-no-files-found: error
  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Install Inno Setup
        run: choco upgrade innosetup -y --no-progress
      - name: Build Windows installer and portable client
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Name release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Move-Item -Path 'dist/*-Windows-x64.zip' -Destination 'out/amir-vpn-windows-x64.zip'
          Move-Item -Path 'dist/*-Windows-Setup-x64.exe' -Destination 'out/amir-vpn-windows-setup-x64.exe'
      - uses: actions/upload-artifact@v7
        with:
          name: amir-vpn-windows
          path: out/
          if-no-files-found: error
  linux:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build Linux client
        run: bash scripts/build-linux.sh
      - name: Name release files
        run: |
          mkdir -p out
          mv dist/*-Linux-amd64.tar.gz out/amir-vpn-linux-x64.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: amir-vpn-linux
          path: out/
          if-no-files-found: error
  publish:
    needs: [plan, android, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amir-vpn-*
          merge-multiple: true
          path: release
      - name: Verify and checksum release files
        working-directory: release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sha256sum --check amir-vpn-android.apk.sha256
          printf '# Arman VPN version: %s\n' "$VERSION" > SHA256SUMS.txt
          sha256sum amir-vpn-android.apk amir-vpn-windows-x64.zip \
            amir-vpn-windows-setup-x64.exe amir-vpn-linux-x64.tar.gz \
            pol-vpn-source.tar.gz pol-vpn-notices.tar.gz >> SHA256SUMS.txt
      - name: Publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag="v$VERSION"
          existing_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -z "$existing_ref" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          fi
          target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag refers to a different commit."
            exit 1
          fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --latest --title "AMiR VPN $VERSION" \
            --notes 'Stable Android, Windows x64, and Linux x64 builds based on the public source of Arman VPN, distributed under GPL-3.0. Source, notices, and checksums accompany the downloads. Live service connectivity is unverified.'
      - name: Verify latest stable release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          expected="$(cd release && printf '%s\n' * | jq -R . | jq -s sort)"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" | jq -e \
            --arg tag "v$VERSION" --argjson expected "$expected" '
              .tag_name == $tag and .draft == false and .prerelease == false
              and ([.assets[].name] | sort) == $expected
              and all(.assets[]; .state == "uploaded" and .size > 0)
            '
